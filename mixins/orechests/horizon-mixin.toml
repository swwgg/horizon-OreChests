[mod]
id = "orechests"
version = "1.0.0"
priority = 100

[compatibility]
horizon_revision = "521614fc7f6c5bb90b6472fca7929b45ff0d0d2b"

[[module]]
id = "rules"
file = "crates/horizon-client/src/game.rs"
name = "orechests_rules"
source = "orechests_rules.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "orechests_glue"
source = "orechests_glue.rs"

[[injection]]
id = "blocks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_blocks"
helper = "blocks.rs"
bindings = [
  { name = "blocks", ty = "&mut Vec<horizon_mods::content::Block>", value = "blocks" },
]

[[injection]]
id = "items"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_items"
helper = "items.rs"
bindings = [
  { name = "items", ty = "&mut Vec<horizon_mods::content::Item>", value = "items" },
]

[[injection]]
id = "block_entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "containers.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block_entity_container"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_container"
helper = "containers.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "screen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen"
helper = "containers.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<horizon_client::mod_api::NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "right_click_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "interact.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "blocked", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "use_item_on"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item_on"
helper = "interact.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "blocked", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "mods"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "mods.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "mods" },
]

[[injection]]
id = "lifecycle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_lifecycle"
helper = "lifecycle.rs"
bindings = [
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::ServerTickPhase", value = "phase" },
]
